<style>
  :root {
    --ink: #1C1A16;
    --paper: #F5EFE0;
    --work: #C1452D;
    --services: #1F7A72;
    --accent: #E8A93D;
    --muted: #C9C2B4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--ink);
    font-family: 'Work Sans', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .board { width: 100%; max-width: 480px; }
  [hidden] { display: none !important; }

  .header { margin-bottom: 22px; animation: reveal 0.6s ease-out both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .wordmark { font-family: 'Archivo Black', sans-serif; font-size: 2.3rem; color: var(--paper); letter-spacing: -0.01em; line-height: 1; margin: 0; }
  .tagline { color: var(--muted); font-size: 0.95rem; margin: 10px 0 0; max-width: 36ch; line-height: 1.4; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 12px 10px; border-radius: 6px; border: 1.5px solid var(--muted); background: transparent; color: var(--paper); font-weight: 600; font-size: 0.92rem; font-family: inherit; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .tab.is-active { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .tab--post.is-active { background: var(--accent); border-color: var(--accent); color: var(--ink); }
  .tab:focus-visible, .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 0.88rem; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .banner--error { background: var(--work); color: var(--paper); }
  .banner--ok { background: var(--services); color: var(--paper); }
  .banner-close { background: none; border: none; color: inherit; font-size: 1.2rem; cursor: pointer; line-height: 1; padding: 0 2px; }

  .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .chips { display: flex; gap: 8px; }
  .chip { padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--muted); background: transparent; color: var(--muted); font-size: 0.85rem; font-weight: 600; font-family: inherit; cursor: pointer; }
  .chip.is-active.chip--all { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .chip.is-active.chip--work { background: var(--work); color: var(--paper); border-color: var(--work); }
  .chip.is-active.chip--services { background: var(--services); color: var(--paper); border-color: var(--services); }
  .search { padding: 10px 12px; border-radius: 6px; border: 1.5px solid var(--muted); background: var(--paper); color: var(--ink); font-size: 0.9rem; font-family: inherit; width: 100%; }
  .search:focus-visible { outline: 2px solid var(--accent); }

  .loading, .empty { color: var(--muted); text-align: center; padding: 32px 12px; }
  .empty p { margin: 0 0 12px; }
  .empty-cta { background: var(--accent); color: var(--ink); border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; font-family: inherit; cursor: pointer; }

  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--paper); border-radius: 4px; padding: 16px; box-shadow: 4px 4px 0 rgba(0,0,0,0.5); transform: rotate(var(--rot, 0deg)); border-top: 5px solid var(--muted); }
  .card--work { border-top-color: var(--work); }
  .card--services { border-top-color: var(--services); }
  .card--new { animation: pop 0.5s ease-out; }
  @keyframes pop { from { transform: scale(0.94) rotate(var(--rot, 0deg)); opacity: 0; } to { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; } }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; color: var(--paper); white-space: nowrap; }
  .badge--work { background: var(--work); }
  .badge--services { background: var(--services); }
  .price { font-weight: 800; background: var(--accent); color: var(--ink); padding: 3px 9px; border-radius: 4px; font-size: 0.85rem; text-align: right; overflow-wrap: anywhere; }
  .card-title { font-size: 1.05rem; font-weight: 700; color: var(--ink); margin: 0 0 6px; line-height: 1.3; overflow-wrap: anywhere; }
  .card-desc { font-size: 0.88rem; color: #4A453C; margin: 0 0 10px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-line; }
  .card-meta { display: flex; gap: 14px; font-size: 0.78rem; color: #8A8272; margin-bottom: 12px; flex-wrap: wrap; }
  .card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px dashed #D9D0BB; padding-top: 10px; }
  .card-name { font-size: 0.85rem; color: #6B644F; font-weight: 600; overflow-wrap: anywhere; }
  .btn { display: inline-block; background: var(--services); color: var(--paper); padding: 7px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .btn--disabled { background: #B9B1A0; color: #6B644F; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; border: 1.5px solid; white-space: nowrap; }
  .tag--need { color: #4A453C; border-color: #4A453C; }
  .tag--offer { color: var(--services); border-color: var(--services); }
  .chips { flex-wrap: wrap; }
  .chip.is-active.chip--kind { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .seg { display: flex; gap: 8px; }
  .seg-btn { flex: 1; padding: 11px 8px; border-radius: 6px; border: 1.5px solid #D9D0BB; background: #FFFDF8; color: #4A453C; font-weight: 700; font-size: 0.9rem; font-family: inherit; cursor: pointer; }
  .seg-btn.is-active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .post { display: flex; flex-direction: column; gap: 14px; background: var(--paper); padding: 18px; border-radius: 6px; box-shadow: 4px 4px 0 rgba(0,0,0,0.5); }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .field label { font-size: 0.82rem; font-weight: 700; color: #4A453C; }
  .field input, .field select, .field textarea { padding: 10px 11px; border-radius: 5px; border: 1.5px solid #D9D0BB; background: #FFFDF8; color: var(--ink); font-family: inherit; font-size: 1rem; width: 100%; }
  .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .field-row { display: flex; gap: 12px; }
  .form-error { color: var(--work); font-size: 0.85rem; font-weight: 600; margin: 0; }
  .submit { background: var(--accent); color: var(--ink); border: none; padding: 13px 18px; border-radius: 6px; font-weight: 800; font-size: 1rem; font-family: inherit; cursor: pointer; }
  .submit:disabled { opacity: 0.6; cursor: default; }
  .submit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .footnote { color: #9B9585; font-size: 0.75rem; text-align: center; margin-top: 24px; line-height: 1.5; }

  @media (prefers-reduced-motion: reduce) { .header, .card--new { animation: none; } }
  @media (max-width: 380px) { .field-row { flex-direction: column; } .wordmark { font-size: 1.95rem; } }
</style>
</head>
<body>
<div class="board" id="app"></div>
<noscript><p style="color:#F5EFE0">KasiJobs needs JavaScript to run. Please enable it and reload.</p></noscript>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://jrzpvamexrjqpxlvqcrd.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_2La0fw-lihHyDy_uQykf-Q_NvTVHJsM';

  var SUBCATS = {
    work: ['Casual jobs', 'Domestic work', 'Construction', 'Gardening', 'Events', 'Security', 'Driving', 'Creative work', 'Other'],
    services: ['Mechanic', 'Electrician', 'Plumber', 'Photographer', 'DJ', 'Makeup artist', 'Other']
  };

  function emptyForm() {
    return { kind: 'need', title: '', group: 'work', subcat: SUBCATS.work[0], description: '', price: '', area: '', name: '', phone: '' };
  }

  var state = {
    tab: 'browse',
    postings: [],
    loading: true,
    filter: 'all',
    kindFilter: 'all',
    query: '',
    justPostedId: null,
    submitting: false,
    form: emptyForm()
  };

  /* ---------- helpers ---------- */

  // Builds DOM nodes. Strings are always inserted as text, never as HTML,
  // so anything people type into a listing cannot inject markup.
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else el.setAttribute(k, v === true ? '' : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(el, k); }); return; }
    el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }

  function normalizePhone(p) {
    var d = String(p || '').replace(/\D/g, '');
    if (d.indexOf('27') === 0 && d.length === 11) return d;
    if (d.charAt(0) === '0' && d.length === 10) return '27' + d.slice(1);
    if (d.length === 9) return '27' + d;
    return null;
  }
  function displayPrice(p) {
    var t = String(p || '').trim();
    if (!t) return '';
    return /^\d+([.,]\d+)?$/.test(t) ? 'R' + t : t;
  }
  function timeAgo(iso) {
    var mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (isNaN(mins) || mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  /* ---------- Supabase ---------- */

  function sbHeaders(extra) {
    var base = { apikey: SUPABASE_KEY };
    if (SUPABASE_KEY.indexOf('sb_') !== 0) base.Authorization = 'Bearer ' + SUPABASE_KEY;
    return Object.assign(base, extra || {});
  }
  function rowToPosting(r) {
    return {
      id: r.id, title: r.title, group: r.group_type === 'services' ? 'services' : 'work', subcat: r.subcat,
      kind: r.kind === 'offer' ? 'offer' : 'need',
      description: r.description || '', price: r.price, area: r.area, name: r.name, phone: r.phone, postedAt: r.posted_at
    };
  }
  function fetchPostings() {
    return fetch(SUPABASE_URL + '/rest/v1/postings?select=*&order=posted_at.desc&limit=200', { headers: sbHeaders() })
      .then(function (res) {
        if (!res.ok) throw new Error('load failed: ' + res.status);
        return res.json();
      })
      .then(function (rows) { return rows.map(rowToPosting); });
  }
  function insertPosting(p) {
    return fetch(SUPABASE_URL + '/rest/v1/postings', {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
      body: JSON.stringify({
        title: p.title, group_type: p.group, subcat: p.subcat, description: p.description,
        price: p.price, area: p.area, name: p.name, phone: p.phone, kind: p.kind
      })
    }).then(function (res) {
      if (!res.ok) throw new Error('save failed: ' + res.status);
      return res.json();
    }).then(function (rows) { return rowToPosting(rows[0]); });
  }

  /* ---------- shell ---------- */

  var app = document.getElementById('app');
  var tabBrowse, tabPost, bannerEl, mainEl, listEl, bannerTimer;

  function build() {
    tabBrowse = h('button', { class: 'tab', role: 'tab', onClick: function () { go('browse'); } }, 'Browse');
    tabPost = h('button', { class: 'tab tab--post', role: 'tab', onClick: function () { go('post'); } }, 'Post');
    bannerEl = h('div', { 'aria-live': 'polite' });
    mainEl = h('main');
    app.replaceChildren(
      h('header', { class: 'header' },
        h('h1', { class: 'wordmark' }, 'KasiJobs'),
        h('p', { class: 'tagline' }, 'Small jobs and services around KwaMhlanga — posted straight from your phone.')),
      h('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'KasiJobs sections' }, tabBrowse, tabPost),
      bannerEl,
      mainEl,
      h('p', { class: 'footnote' }, 'Meet in a public place and never pay before the job is done.')
    );
  }

  function banner(type, msg, ms) {
    clearTimeout(bannerTimer);
    if (!msg) { bannerEl.replaceChildren(); return; }
    bannerEl.replaceChildren(
      h('div', { class: 'banner banner--' + type, role: 'status' },
        h('span', null, msg),
        h('button', { class: 'banner-close', 'aria-label': 'Dismiss', onClick: function () { banner(); } }, '×'))
    );
    if (ms) bannerTimer = setTimeout(function () { banner(); }, ms);
  }

  function go(tab, opts) {
    state.tab = tab;
    tabBrowse.classList.toggle('is-active', tab === 'browse');
    tabPost.classList.toggle('is-active', tab === 'post');
    tabBrowse.setAttribute('aria-selected', String(tab === 'browse'));
    tabPost.setAttribute('aria-selected', String(tab === 'post'));
    if (tab === 'browse') {
      renderBrowse();
      if (!(opts && opts.skipRefresh)) refresh();
    } else {
      renderPost();
    }
  }

  function refresh() {
    return fetchPostings().then(function (rows) {
      state.postings = rows;
      state.loading = false;
      if (bannerEl.querySelector('.banner--error')) banner();
    }).catch(function () {
      state.loading = false;
      banner('error', 'Could not load listings — check your internet and try again.');
    }).then(function () {
      if (state.tab === 'browse' && listEl) renderList();
    });
  }

  /* ---------- browse ---------- */

  function renderBrowse() {
    listEl = h('div');
    var chips = ['all', 'work', 'services'].map(function (f) {
      var btn = h('button', {
        class: 'chip chip--' + f + (state.filter === f ? ' is-active' : ''),
        onClick: function () {
          state.filter = f;
          chipsEl.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('is-active'); });
          btn.classList.add('is-active');
          renderList();
        }
      }, f === 'all' ? 'All' : f === 'work' ? 'Work' : 'Services');
      return btn;
    });
    var chipsEl = h('div', { class: 'chips' }, chips);
    var search = h('input', {
      class: 'search', type: 'search', placeholder: 'Search postings…', 'aria-label': 'Search postings',
      value: state.query,
      onInput: function (e) { state.query = e.target.value; renderList(); }
    });
    var kindEl = h('div', { class: 'chips' });
    [['all', 'Everything'], ['need', 'Need someone'], ['offer', 'Offering']].forEach(function (d) {
      var kb = h('button', {
        class: 'chip chip--kind' + (state.kindFilter === d[0] ? ' is-active' : ''),
        onClick: function () {
          state.kindFilter = d[0];
          kindEl.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('is-active'); });
          kb.classList.add('is-active');
          renderList();
        }
      }, d[1]);
      kindEl.appendChild(kb);
    });
    mainEl.replaceChildren(h('div', { class: 'filters' }, chipsEl, kindEl, search), listEl);
    renderList();
  }

  function renderList() {
    var q = state.query.trim().toLowerCase();
    var items = state.postings.filter(function (p) {
      if (state.filter !== 'all' && p.group !== state.filter) return false;
      if (state.kindFilter !== 'all' && p.kind !== state.kindFilter) return false;
      if (!q) return true;
      return [p.title, p.description, p.subcat, p.area].some(function (s) { return String(s || '').toLowerCase().indexOf(q) !== -1; });
    });

    if (state.loading) {
      listEl.replaceChildren(h('p', { class: 'loading' }, 'Loading listings…'));
      return;
    }
    if (items.length === 0) {
      listEl.replaceChildren(h('div', { class: 'empty' },
        h('p', null, state.postings.length === 0 ? 'Nothing posted yet.' : 'Nothing matches that search.'),
        state.postings.length === 0 ? h('button', { class: 'empty-cta', onClick: function () { go('post'); } }, 'Be the first — post something') : null));
      return;
    }
    listEl.replaceChildren(h('ul', { class: 'list' }, items.map(card)));
  }

  function card(p, i) {
    var n = normalizePhone(p.phone);
    var wa = n ? 'https://wa.me/' + n + '?text=' + encodeURIComponent('Hi, I saw your KasiJobs post: ' + p.title) : null;
    var li = h('li', { class: 'card card--' + p.group + (p.id === state.justPostedId ? ' card--new' : '') },
      h('div', { class: 'card-top' },
        h('div', { class: 'badges' },
          h('span', { class: 'badge badge--' + p.group }, p.subcat),
          h('span', { class: 'tag tag--' + p.kind }, p.kind === 'offer' ? 'Offering' : 'Needs someone')),
        h('span', { class: 'price' }, displayPrice(p.price))),
      h('h3', { class: 'card-title' }, p.title),
      p.description ? h('p', { class: 'card-desc' }, p.description) : null,
      h('div', { class: 'card-meta' }, h('span', null, p.area), h('span', null, 'Posted ' + timeAgo(p.postedAt))),
      h('div', { class: 'card-bottom' },
        h('span', { class: 'card-name' }, p.name),
        wa ? h('a', { class: 'btn', href: wa, target: '_blank', rel: 'noopener noreferrer' }, 'WhatsApp')
           : h('span', { class: 'btn btn--disabled' }, 'No number'))
    );
    li.style.setProperty('--rot', ['-0.6deg', '0.5deg', '-0.3deg'][i % 3]);
    return li;
  }

  /* ---------- post a job ---------- */

  function field(label, id, input) {
    return h('div', { class: 'field' }, h('label', { for: id }, label), input);
  }
  function textInput(id, key, placeholder, o) {
    o = o || {};
    return h('input', {
      id: id, type: o.type || 'text', value: state.form[key], placeholder: placeholder,
      maxlength: o.max || null, inputmode: o.inputmode || null, autocomplete: o.auto || 'off',
      onInput: function (e) { state.form[key] = e.target.value; }
    });
  }
  function fillSubcat(sel) {
    sel.replaceChildren.apply(sel, SUBCATS[state.form.group].map(function (s) {
      return h('option', { value: s, selected: s === state.form.subcat }, s);
    }));
  }

  function renderPost() {
    var f = state.form;
    var errEl = h('p', { class: 'form-error', role: 'alert', hidden: true });
    function showErr(msg) { errEl.textContent = msg; errEl.hidden = false; }

    var groupSel = h('select', { id: 'f-group' },
      h('option', { value: 'work', selected: f.group === 'work' }, 'Work'),
      h('option', { value: 'services', selected: f.group === 'services' }, 'Services'));
    var subSel = h('select', { id: 'f-subcat', onChange: function (e) { state.form.subcat = e.target.value; } });
    fillSubcat(subSel);
    groupSel.addEventListener('change', function (e) {
      state.form.group = e.target.value;
      state.form.subcat = SUBCATS[state.form.group][0];
      fillSubcat(subSel);
    });

    var desc = h('textarea', {
      id: 'f-desc', rows: 3, maxlength: 600, placeholder: 'When, where exactly, and anything people should know',
      onInput: function (e) { state.form.description = e.target.value; }
    }, f.description);

    var submit = h('button', { class: 'submit', type: 'button' }, 'Post it');
    submit.addEventListener('click', function () { doSubmit(submit, showErr); });

    var KIND_TEXT = {
      need: { title: 'e.g. Need 2 people to move furniture Saturday', rate: 'Budget', ratePh: 'e.g. R350 for the day' },
      offer: { title: 'e.g. Electrician: wiring, DB boards, call-outs', rate: 'Your rate', ratePh: 'e.g. From R350 call-out' }
    };
    var titleInput = textInput('f-title', 'title', KIND_TEXT[f.kind].title, { max: 120 });
    var rateInput = textInput('f-price', 'price', KIND_TEXT[f.kind].ratePh, { max: 40 });
    var rateLabel = h('label', { for: 'f-price' }, KIND_TEXT[f.kind].rate);
    var needBtn = h('button', { type: 'button', class: 'seg-btn' + (f.kind === 'need' ? ' is-active' : '') }, 'I need someone');
    var offerBtn = h('button', { type: 'button', class: 'seg-btn' + (f.kind === 'offer' ? ' is-active' : '') }, "I'm offering a service");
    function setKind(k) {
      state.form.kind = k;
      needBtn.classList.toggle('is-active', k === 'need');
      offerBtn.classList.toggle('is-active', k === 'offer');
      titleInput.setAttribute('placeholder', KIND_TEXT[k].title);
      rateInput.setAttribute('placeholder', KIND_TEXT[k].ratePh);
      rateLabel.textContent = KIND_TEXT[k].rate;
    }
    needBtn.addEventListener('click', function () { setKind('need'); });
    offerBtn.addEventListener('click', function () { setKind('offer'); });

    mainEl.replaceChildren(h('section', { class: 'post' },
      h('div', { class: 'field' }, h('label', null, 'What would you like to do?'), h('div', { class: 'seg' }, needBtn, offerBtn)),
      field("What's this about?", 'f-title', titleInput),
      h('div', { class: 'field-row' }, field('Category', 'f-group', groupSel), field('Type', 'f-subcat', subSel)),
      field('Add the details', 'f-desc', desc),
      h('div', { class: 'field-row' },
        h('div', { class: 'field' }, rateLabel, rateInput),
        field('Area', 'f-area', textInput('f-area', 'area', 'e.g. Zone 1', { max: 60 }))),
      h('div', { class: 'field-row' },
        field('Your name', 'f-name', textInput('f-name', 'name', 'Optional', { max: 60, auto: 'name' })),
        field('Your WhatsApp number', 'f-phone', textInput('f-phone', 'phone', '072 123 4567', { type: 'tel', max: 20, inputmode: 'tel', auto: 'tel' }))),
      errEl,
      submit
    ));
  }

  function doSubmit(btn, showErr) {
    if (state.submitting) return;
    var f = state.form;
    var title = f.title.trim(), price = f.price.trim(), phone = f.phone.trim();
    if (!title || !price || !phone) { showErr("Add what it's about, a price or rate, and a number to reach you."); return; }
    if (!normalizePhone(phone)) { showErr('Enter a valid South African number, like 072 123 4567.'); return; }

    state.submitting = true;
    btn.disabled = true;
    btn.textContent = 'Posting…';
    insertPosting({
      kind: f.kind, title: title, group: f.group, subcat: f.subcat, description: f.description.trim(), price: price,
      area: f.area.trim() || 'KwaMhlanga', name: f.name.trim() || 'Local poster', phone: phone
    }).then(function (saved) {
      state.postings.unshift(saved);
      state.form = emptyForm();
      state.justPostedId = saved.id;
      go('browse', { skipRefresh: true });
      banner('ok', 'Posted. People can reach you on WhatsApp now.', 4000);
      setTimeout(function () { state.justPostedId = null; }, 900);
    }).catch(function () {
      showErr('Could not post — check your internet and try again.');
    }).then(function () {
      state.submitting = false;
      btn.disabled = false;
      btn.textContent = 'Post it';
    });
  }

  /* ---------- start ---------- */

  build();
  go('browse', { skipRefresh: true });
  refresh();
  setInterval(function () {
    if (state.tab === 'browse' && !document.hidden) refresh();
  }, 60000);
})();
</script>
<script>
  /* Lets phones install KasiJobs as an app. Safe to fail: the page works without it. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
    });
  }
</script>
</body>
